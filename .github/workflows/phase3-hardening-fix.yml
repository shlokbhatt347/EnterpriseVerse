name: Phase 3 Hardening Fix

on:
  push:
    branches: [phase-3-deep-business-world]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-deep-business-world
          fetch-depth: 2
      - name: Fix long-horizon lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/simulation/src/business-world.ts')
          s = p.read_text()
          old = 'function stage(b:Business):Stage{if(b.cash<=0)return"failure";'
          new = 'function stage(b:Business):Stage{if(b.cash<=0&&b.debt>100000)return"failure";'
          if old not in s:
              raise SystemExit('expected lifecycle guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove self
        run: rm .github/workflows/phase3-hardening-fix.yml
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/simulation/src/business-world.ts .github/workflows/phase3-hardening-fix.yml
          git commit -m 'fix(simulation): preserve long-horizon world stability'
          git push origin phase-3-deep-business-world
