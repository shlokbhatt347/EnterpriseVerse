name: Phase 3 Index Fix

on:
  push:
    branches: [phase-3-deep-business-world]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-deep-business-world
      - name: Repair simulation barrel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/simulation/src/index.ts')
          s = p.read_text()
          if '<<<<<<<' in s or '=======' in s or '>>>>>>>' in s:
              raise SystemExit('merge conflict markers found in simulation index')
          anchor = 'export * from "./assessment";'
          additions = '\nexport * from "./phase1";\nexport * from "./engine";\nexport * from "./phase5";\nexport * from "./intelligence";\nexport * from "./business-world";'
          if 'export * from "./business-world";' not in s:
              if anchor not in s:
                  raise SystemExit('simulation export anchor not found')
              s = s.replace(anchor, anchor + additions, 1)
              p.write_text(s)
          PY
      - name: Remove self
        run: rm .github/workflows/phase3-index-fix.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/simulation/src/index.ts .github/workflows/phase3-index-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(simulation): restore complete phase 3 exports'
          git push origin phase-3-deep-business-world
