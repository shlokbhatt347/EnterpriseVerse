name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'chore/**', 'audit/**']
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run simulation tests
        run: pnpm test:simulation

      - name: Typecheck simulation package
        run: pnpm typecheck:simulation

      - name: Typecheck web app
        run: pnpm typecheck:web

      - name: Build web app
        run: pnpm build:web

      - name: Validate API Python syntax
        run: python -m compileall -q apps/api/app

      - name: Verify required project files
        run: |
          test -f README.md
          test -f docs/01_PRD.md
          test -f packages/simulation/src/index.ts
          test -f packages/simulation/src/economy/index.ts
          test -f packages/simulation/src/market.ts
          test -f packages/simulation/src/world.ts
          test -f apps/web/app/page.tsx
          test -f apps/api/app/main.py
          test -f apps/api/requirements.txt
