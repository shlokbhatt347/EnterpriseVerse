name: Phase 24 one-time repair

on:
  push:
    branches: [feat/phase-24-best-in-class-uiux]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Phase 24 page and remove repair workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/page.tsx')
          text = path.read_text()
          broken = '</div></n      </div></div></main>;\n}'
          fixed = '</div></div></section>\n      </div></div></main>;\n}'
          if broken not in text:
              raise SystemExit('Phase 24 page already repaired or target pattern changed; no automatic edit applied.')
          path.write_text(text.replace(broken, fixed, 1))
          PY
          rm .github/workflows/phase24-one-time-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/page.tsx .github/workflows/phase24-one-time-fix.yml
          git commit -m 'fix: close Phase 24 decision card markup'
          git push
